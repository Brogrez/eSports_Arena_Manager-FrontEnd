<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eSports Arena Manager | Inscripción a torneo</title>
    <meta name="description" content="Inscribe a un jugador o a tu equipo en un torneo disponible." />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="cabecera">
    <div class="contenedor barra-navegacion">
        <a href="index.html" class="marca">
            <span class="marca__icono" aria-hidden="true">EA</span>
            eSports Arena Manager
        </a>
        <button class="nav-toggle" aria-expanded="false" aria-controls="menu-principal">Menú</button>
        <nav aria-label="Navegación principal">
            <ul class="nav-lista" id="menu-principal">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="torneos.html">Torneos</a></li>
                <li><a href="inscripcion.html">Inscripción</a></li>
                <li><a href="equipo.html">Mi equipo</a></li>
                <li><a href="perfil.html">Mi perfil</a></li>
            </ul>
        </nav>
        <span class="perfil-rol">Perfil de prueba: Jugador</span>
    </div>
</header>
<main>
    <section class="seccion contenedor">
        <div class="seccion__titulo-grupo">
            <h1>Inscripción a torneo</h1>
            <p>Completa el formulario para registrar tu participación como jugador individual o representando a un equipo.</p>
        </div>

        <div class="flex" style="align-items:flex-start; gap:2rem; flex-wrap:wrap;">
            <form class="formulario" id="form-inscripcion" novalidate>
                <div class="campo">
                    <label for="campo-torneo">Torneo</label>
                    <select id="campo-torneo" name="torneo" required autocomplete="off">
                        <option value="">Selecciona un torneo</option>
                    </select>
                    <span class="mensaje-error" id="error-torneo" role="alert"></span>
                </div>

                <div class="campo">
                    <span id="etiqueta-tipo">Tipo de participante</span>
                    <div class="fila-radios" role="radiogroup" aria-labelledby="etiqueta-tipo">
                        <label>
                            <input type="radio" name="tipoParticipante" value="jugador" checked />
                            Jugador individual
                        </label>
                        <label>
                            <input type="radio" name="tipoParticipante" value="equipo" />
                            Equipo
                        </label>
                    </div>
                </div>
